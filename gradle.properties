org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.caching=false
# ✅ 必须关（7.1.39 的 neoFormPatch 违反 Gradle 9.x config-cache 契约）
org.gradle.configuration-cache=false

# ===== 从 Fabric 复制的基础 mod 信息（值原样未改）=====
mod_version=2.7.13
maven_group=semmiedev
archives_base_name=disc_jockey_plus
mod_id=disc_jockey
mod_name=Disc Jockey Plus
mod_license=MIT

# ===== Minecraft / NeoForge 26.3（✅ 已核实真实版本）=====
minecraft_version=26.3
minecraft_version_range=[26.3]
