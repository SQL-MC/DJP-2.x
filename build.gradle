plugins {
    id 'net.fabricmc.fabric-loom' version '1.18.1'
    id 'maven-publish'
}


processResources {
    // ✅ 明确字符集（非常重要）
    filteringCharset "UTF-8"

    // ✅ 声明输入属性（用于增量构建）
    inputs.property "mod_version", project.mod_version
    inputs.property "version", project.mod_version

    // ✅ 只展开 fabric.mod.json
    filesMatching("fabric.mod.json") {
        expand "version": project.mod_version, "mod_version": project.mod_version
    }

    // ✅ 只展开 version.txt
    filesMatching("assets/disc_jockey/version.txt") {
        expand "version": project.mod_version, "mod_version": project.mod_version
    }

    // ❌ 绝不允许裸的 expand 写在外面
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url "https://maven.shedaniel.me/" }
    maven { url "https://maven.terraformersmc.com/releases/" }
}

loom {
    accessWidenerPath = file("src/main/resources/disc_jockey.accesswidener")
}

dependencies {
    implementation files('D:/pianolib-1.0.3+DJP2.7.3.jar')
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
//    mappings loom.officialMojangMappings()
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    implementation("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}")

    implementation("com.terraformersmc:modmenu:${project.modmenu_version}")
}


tasks.withType(JavaCompile).configureEach {
    sourceCompatibility = '11'
    targetCompatibility = '11'
    it.options.encoding = "UTF-8"
    it.options.release = 25
}

java {
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}" }
    }
}

// configure the maven publication
publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId project.archives_base_name
            from components.java
        }
    }

    repositories {

    }
}