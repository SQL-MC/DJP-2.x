plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.39'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = maven_group

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
    mavenCentral()
    flatDir { dirs 'libs' }
}

base {
    archivesName = archives_base_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

runs {
    configureEach { run ->
        run.systemProperty 'forge.logging.markers', 'REGISTRIES'
        run.systemProperty 'forge.logging.console.level', 'debug'
        run.workingDirectory = project.layout.projectDirectory.dir('run').dir(run.name)
        run.modSource sourceSets.main
    }

    client { }

    server { programArguments '--nogui' }

    gameTestServer {
        systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
    }

    clientData {
        programArguments.addAll(
            '--mod', mod_id,
            '--all',
            '--output', file('src/generated/resources/').absolutePath,
            '--existing', file('src/main/resources/').absolutePath
        )
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
}

// ===== 资源处理：与 Fabric 版同款写法（单字符串 filesMatching + 内联 expand） =====
processResources {
    filteringCharset "UTF-8"

    inputs.property "mod_version", project.mod_version
    inputs.property "version", project.mod_version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "minecraft_version_range", project.minecraft_version_range
    inputs.property "neo_version", project.neo_version
    inputs.property "mod_id", project.mod_id
    inputs.property "mod_name", project.mod_name
    inputs.property "mod_license", project.mod_license

    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": project.mod_version,
               "mod_version": project.mod_version,
               "minecraft_version": project.minecraft_version,
               "minecraft_version_range": project.minecraft_version_range,
               "neo_version": project.neo_version,
               "mod_id": project.mod_id,
               "mod_name": project.mod_name,
               "mod_license": project.mod_license
    }

    filesMatching("assets/disc_jockey/version.txt") {
        expand "version": project.mod_version, "mod_version": project.mod_version
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}